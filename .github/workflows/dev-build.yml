# Fast development build: DX11-AVX only, no release.
# Runs on pushes to dlss-* branches and can be started manually from the Actions tab.
# Download the "dev_DX11-AVX" artifact from the run page: it contains bin/ (exe + pdb + nvngx_dlss.dll)
# and db/mods/00_modded_exes_gamedata.db0, laid out like the Anomaly folder.
# bin/dlss_dev/nvngx_dlss.dll is NVIDIA's development DLL (on-screen debug overlay), swap it in for debugging.

name: Dev build (DX11-AVX)

on:
  push:
    branches: [ "dlss-*" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: src/engine-vs2022.sln
  BUILD_CONF: DX11-AVX
  PACK_GAMEDATA_NAME: 00_modded_exes_gamedata.db0
  DLSS_SDK_TAG: v310.9.1

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-dx11-avx
    runs-on: windows-latest

    steps:
    - name: Configure Pagefile
      uses: al-cheb/configure-pagefile-action@v1.3
      with:
        minimum-size: 8GB
        maximum-size: 8GB
        disk-root: "C:"

    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Fetch NVIDIA DLSS SDK
      run: |
        $dst = "src/3rd party/NVIDIA-DLSS"
        git -c advice.detachedHead=false clone -q --depth 1 --branch ${{ env.DLSS_SDK_TAG }} --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git "$dst"
        git -C "$dst" sparse-checkout set --no-cone /include/ /LICENSE.txt /lib/Windows_x86_64/x64/nvsdk_ngx_d.lib /lib/Windows_x86_64/rel/nvngx_dlss.dll /lib/Windows_x86_64/dev/nvngx_dlss.dll
        if (!(Test-Path "$dst/lib/Windows_x86_64/x64/nvsdk_ngx_d.lib")) { throw "DLSS SDK fetch failed" }

    - name: Compile FSR shaders
      run: powershell -ExecutionPolicy Bypass -File "src/3rd party/FidelityFX-FSR3/compile_shaders.ps1"

    - name: setup-msbuild
      uses: microsoft/setup-msbuild@v1.3.1
      with:
        msbuild-architecture: "x64"

    - name: Build ${{ env.BUILD_CONF }}
      run: msbuild /p:Configuration=${{ env.BUILD_CONF }} ${{ env.SOLUTION_FILE_PATH }}

    - name: Pack gamedata
      run: |
        new-item -path "./compressor/gamedata" -itemtype directory -force
        copy-item -path "./gamedata/*" -destination "./compressor/gamedata" -recurse -force
        cd ./compressor
        start-process -filepath "./! compress_gamedata.cmd" -Wait
        rename-item -path gamedata.db0 -newname ${{ env.PACK_GAMEDATA_NAME }}

    - name: Stage package
      run: |
        new-item -path "./package/bin" -itemtype directory -force
        new-item -path "./package/db/mods" -itemtype directory -force
        copy-item -path "./_build/_game/bin_dbg/*.exe" -destination "./package/bin"
        copy-item -path "./_build/_game/bin_dbg/*.pdb" -destination "./package/bin"
        copy-item -path "./compressor/${{ env.PACK_GAMEDATA_NAME }}" -destination "./package/db/mods"
        $sdk = "./src/3rd party/NVIDIA-DLSS"
        copy-item -path "$sdk/lib/Windows_x86_64/rel/nvngx_dlss.dll" -destination "./package/bin"
        copy-item -path "$sdk/LICENSE.txt" -destination "./package/bin/nvngx_dlss_LICENSE.txt"
        new-item -path "./package/bin/dlss_dev" -itemtype directory -force
        copy-item -path "$sdk/lib/Windows_x86_64/dev/nvngx_dlss.dll" -destination "./package/bin/dlss_dev"

    - name: Upload package
      uses: actions/upload-artifact@v4.6.0
      with:
        name: dev_${{ env.BUILD_CONF }}
        path: ./package
        if-no-files-found: "error"
        retention-days: 14
